<body>

  <h1>Jewellery Price Calculator</h1>
  <div class="container">

    <!-- Necklace Section -->
    <div class="section">
      <h2>Necklace</h2>
      <label>Gold (Qty):</label>
      <input type="number" id="necklaceGoldQty" value="0" min="0"><br>
      <label>Diamond (Qty):</label>
      <input type="number" id="necklaceDiamondQty" value="0" min="0"><br>
      <label>Artificial (Qty):</label>
      <input type="number" id="necklaceArtificialQty" value="0" min="0"><br>
      <button onclick="calculateNecklace()">Calculate Necklace</button>
      <div id="necklaceResult" class="result"></div>
    </div>

    <!-- Earrings Section -->
    <div class="section">
      <h2>Earrings</h2>
      <label>Gold (Qty):</label>
      <input type="number" id="earringsGoldQty" value="0" min="0"><br>
      <label>Diamond (Qty):</label>
      <input type="number" id="earringsDiamondQty" value="0" min="0"><br>
      <label>Artificial (Qty):</label>
      <input type="number" id="earringsArtificialQty" value="0" min="0"><br>
      <button onclick="calculateEarrings()">Calculate Earrings</button>
      <div id="earringsResult" class="result"></div>
    </div>

    <!-- Rings Section -->
    <div class="section">
      <h2>Rings</h2>
      <label>Gold (Qty):</label>
      <input type="number" id="ringsGoldQty" value="0" min="0"><br>
      <label>Diamond (Qty):</label>
      <input type="number" id="ringsDiamondQty" value="0" min="0"><br>
      <label>Artificial (Qty):</label>
      <input type="number" id="ringsArtificialQty" value="0" min="0"><br>
      <button onclick="calculateRings()">Calculate Rings</button>
      <div id="ringsResult" class="result"></div>
    </div>

    <!-- Bangles Section -->
    <div class="section">
      <h2>Bangles</h2>
      <label>Gold (Qty):</label>
      <input type="number" id="banglesGoldQty" value="0" min="0"><br>
      <label>Diamond (Qty):</label>
      <input type="number" id="banglesDiamondQty" value="0" min="0"><br>
      <label>Artificial (Qty):</label>
      <input type="number" id="banglesArtificialQty" value="0" min="0"><br>
      <button onclick="calculateBangles()">Calculate Bangles</button>
      <div id="banglesResult" class="result"></div>
    </div>

    <!-- Total Bill -->
    <div class="total-bill" id="totalBill">Total Bill: Rs. 0</div>
  </div>

  <script src="Price calculator JS .js"></script>
</body>
